baseURL = "https://rookie552001-ai.github.io/linux-blog/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "姜泽之的学习笔记"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
hasCJKLanguage = true
paginate = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
author = "姜泽之"
description = "记录 Linux 基础、文件管理和 Shell 编程的学习笔记。"
mainSections = ["posts"]
defaultTheme = "light"
disableThemeToggle = false
ShowReadingTime = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false
DateFormat = "2006年01月02日"

[params.homeInfoParams]
Title = "你好，我是姜泽之"
Content = "把命令写清楚，把原理想明白。这里记录我整理的 Linux 基础、文件权限和 Shell 编程笔记，欢迎一起学习。"

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
ignoreLocation = true
threshold = 0.35
minMatchCharLength = 1
keys = ["title", "summary", "content"]

